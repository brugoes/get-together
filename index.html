<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#50C878">
<title>Get Together!</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap">
<style>
:root{--g:#50C878;--ink:#111;--card:#fff;--mut:#777;--line:#e4e4e4;--soft:#e9f9ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2f2f2;--card:#1d1d1d;--mut:#aaa;--line:#333;--soft:#14301f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--g);font-family:Fredoka,system-ui,sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
.logo{font-family:Pacifico,'Brush Script MT',cursive;color:#fff;text-align:center;margin:0;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.08)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);padding:10px 0}
header .logo{font-size:32px;transition:opacity .25s}
.hero{display:none}
@media(min-width:768px){.hero{display:flex;align-items:center;justify-content:center;min-height:52vh}.hero .logo{font-size:clamp(64px,10vw,120px)}body.hero-on header .logo{opacity:0}}
main{max-width:720px;margin:0 auto;padding:8px 14px 60px}
.card{background:var(--card);border-radius:22px;padding:20px;margin:0 0 16px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
h2{margin:0 0 12px;font-size:24px}h3{margin:18px 0 8px;font-size:18px}
label{display:block;margin:12px 0 0;font-weight:500;font-size:15px}.opt{color:var(--mut);font-weight:400}
input,textarea,select{width:100%;font:inherit;font-size:16px;padding:12px;margin-top:5px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--g)}
::placeholder{color:#aaa;opacity:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:999px;background:var(--g);color:#fff;font:inherit;font-weight:600;font-size:17px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}.btn.sm{display:inline-block;width:auto;margin:0;padding:8px 16px;font-size:15px}.btn:disabled{opacity:.5}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.duo .btn{margin-top:12px}.duo .on{outline:4px solid var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:12px;border:0;border-radius:999px;font:inherit;font-weight:600;background:rgba(255,255,255,.35);color:#fff;cursor:pointer}.tabs .on{background:#fff;color:#111}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;-webkit-overflow-scrolling:touch}
.chip{flex:1 1 0;min-width:0;padding:8px 2px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;text-align:center}.chip.on{background:var(--g);border-color:var(--g);color:#fff}.chip b{display:block}
.grid{max-height:300px;overflow-y:auto;border:2px solid var(--line);border-radius:14px;user-select:none;-webkit-user-select:none}
.c{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding-left:8px;font-size:12px;color:var(--mut);cursor:pointer}
.c.on{background:var(--g);color:#fff}.c.pd{background:var(--soft);outline:2px dashed var(--g);outline-offset:-2px}.c.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--line) 6px 7px);cursor:not-allowed}
.hint{font-size:13px;color:var(--mut);margin:6px 0}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:500;margin-bottom:6px}.car{width:44px;height:44px;border:0;border-radius:50%;background:var(--g);color:#fff;font-size:28px;line-height:1;cursor:pointer;padding:0 0 4px}.car:disabled{opacity:.3;cursor:default}.chips{gap:4px}.chips .chip{font-size:12px}.how{background:var(--soft);border-left:5px solid var(--g);border-radius:12px;padding:10px 12px;margin:6px 0 10px}.how b{display:block;font-size:17px}.how span{font-size:14px;color:var(--mut)}
.tag{display:inline-flex;gap:6px;align-items:center;background:var(--soft);border-radius:999px;padding:6px 6px 6px 12px;margin:4px 6px 0 0;font-size:14px}.tag button{border:0;background:var(--g);color:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:14px}
.best{border:2px solid var(--g);border-radius:16px;padding:12px;margin:10px 0;background:var(--soft)}.best.top{border-width:3px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;word-break:break-all}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;background:var(--card);color:var(--ink);border-radius:16px;padding:14px 14px 14px 52px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:560px;margin:auto}
.toast button{position:absolute;left:8px;top:8px;width:36px;height:36px;border:0;border-radius:50%;background:#000;color:#fff;font-size:22px;line-height:1;cursor:pointer}
.big{font-size:20px;text-align:center}a.btn{text-decoration:none;text-align:center;color:#fff}a.btn.alt{color:var(--ink)}footer{text-align:center;color:#000;font-size:12px;line-height:1.5;padding:0 14px calc(24px + env(safe-area-inset-bottom,0px))}footer a{color:#000;text-decoration:underline}
</style></head>

<script>
const $=(s,e=document)=>e.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0'),iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const fmt=m=>{const h=Math.floor(m/60),i=m%60;return((h+11)%12+1)+(i?':'+p2(i):'')+(h>=12&&h<24?'pm':'am')};
const dl=d=>new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const sl=s=>dl(s.d)+' '+fmt(s.a)+'–'+fmt(s.b),tm=v=>{const[a,b]=(v||'').split(':');return a==null||b==null||v===''?null:+a*60+ +b};
const cmp=(x,y)=>x.d<y.d?-1:x.d>y.d?1:x.a-y.a,rnd=()=>Math.random().toString(36).slice(2,8);
const base=()=>location.href.split('#')[0];
let unsub=[],tmr,memSubs=[];
window.addEventListener('scroll',()=>document.body.classList.toggle('hero-on',scrollY<innerHeight*.3),{passive:true});
function toast(t){clearTimeout(tmr);$('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.innerHTML='<button aria-label="Close">×</button>'+t;d.firstChild.onclick=()=>d.remove();document.body.append(d);tmr=setTimeout(()=>d.remove(),30000)}
/* data layer: Firebase Firestore */
const FIREBASE_CONFIG={apiKey:"AIzaSyDCFYKSDYqU3g5h50SWe5SqBZxu5uG226k",authDomain:"get-together-f1287.firebaseapp.com",projectId:"get-together-f1287",appId:"1:451640226307:web:d065705284f62a622ed436"};
const ready=!FIREBASE_CONFIG.apiKey.startsWith('PASTE');let fs=null;
if(ready){firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore()}
const put=(p,o)=>fs.doc(p).set(o);
const upd=(p,o)=>fs.doc(p).update(o);
function watch(id,cb){
 unsub.push(fs.doc('events/'+id).onSnapshot(s=>cb(s.exists?s.data():null,null),()=>cb(null,null)));
 unsub.push(fs.collection('events/'+id+'/r').onSnapshot(q=>cb(undefined,q.docs.map(d=>({id:d.id,...d.data()})))))}
/* date/time picker: tap start then end, or drag with a mouse */
function picker(el,o){const S=o.slots,A=o.allowed;
 const N=A?[...new Set(A.map(s=>s.d))].sort():null,maxWk=A?Math.ceil(N.length/7)-1:51;let wk=0;const view=()=>A?N.slice(wk*7,wk*7+7):Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()+wk*7+i);return iso(d)});
 let day=view()[0],pend=null,dn=null;
 const wins=()=>A?A.filter(s=>s.d==day):[{a:420,b:1380}];
 const inA=m=>wins().some(w=>m>=w.a&&m<w.b);
 
 function put1(d,a,b){let n={d,a,b};for(let i=S.length-1;i>=0;i--){const s=S[i];if(s.d==d&&s.a<=n.b&&s.b>=n.a){n.a=Math.min(n.a,s.a);n.b=Math.max(n.b,s.b);S.splice(i,1)}}S.push(n);S.sort(cmp)}
 function add(a,b){if(a>b)[a,b]=[b,a];if(a==b)return;const bak=S.slice();
  wins().forEach(w=>{const x=Math.max(a,w.a),y=Math.min(b,w.b);if(x<y)put1(day,x,y)});
  if(S.length>o.max){S.splice(0,S.length,...bak);toast('You can pick up to '+o.max+' time windows.')}
  pend=null;draw();o.onchange&&o.onchange()}
 function draw(){const lo=Math.min(...wins().map(w=>w.a)),hi=Math.max(...wins().map(w=>w.b));let g='';for(let m=lo;m<hi;m+=30){const on=S.some(s=>s.d==day&&m>=s.a&&m<s.b);
   g+=`<div class="c${on?' on':''}${pend===m?' pd':''}${inA(m)?'':' off'}" data-m="${m}">${m%60?'':fmt(m)}</div>`}
  el.innerHTML=`<div class="nav"><button type="button" class="car" data-wk="-1" aria-label="Previous week" ${wk?'':'disabled'}>‹</button><span>${esc(dl(view()[0]))} – ${esc(dl(view()[view().length-1]))}</span><button type="button" class="car" data-wk="1" aria-label="Next week" ${wk<maxWk?'':'disabled'}>›</button></div><div class="chips">${view().map(d=>`<button type="button" class="chip${d==day?' on':''}" data-d="${d}"><b>${dl(d).split(',')[0]}</b>${dl(d).split(', ')[1]}</button>`).join('')}</div>
  <div class="how"><b>${pend!=null?'Now tap the time you’re free until':'Drag to select the times you’re free'}</b><span>${pend!=null?'Tap an end time to finish.':'On a computer, click and drag down the times. On a phone, tap a start time, then tap an end time.'}</span></div>
  <div class="grid">${g}</div>
  
  
  <div style="margin-top:10px">${S.length?S.map((s,i)=>`<span class="tag">${esc(sl(s))}<button type="button" aria-label="Remove" data-x="${i}">×</button></span>`).join(''):'<span class="hint">No times yet.</span>'}</div>
  <div class="hint">${S.length} of ${o.max} max${o.min?' (at least '+o.min+')':''}</div>`}
 el.onclick=e=>{const t=e.target.closest('[data-d],[data-m],[data-x],[data-wk]');if(!t)return;
  if(t.dataset.wk){wk=Math.max(0,Math.min(maxWk,wk+ +t.dataset.wk));day=view()[0];pend=null;draw()}else if(t.dataset.d){day=t.dataset.d;pend=null;draw()}
  else if(t.dataset.x!=null){S.splice(+t.dataset.x,1);draw();o.onchange&&o.onchange()}
  else if(t.dataset.add!=null){const a=tm($('.ms',el).value),b=tm($('.me',el).value);if(a==null||b==null||b<=a)return toast('Enter a start and a later end time.');
   if(!wins().some(w=>a<w.b&&b>w.a))return toast('That time is outside the host’s options.');add(a,b)}
  else{const m=+t.dataset.m;if(!inA(m))return;if(pend==null){pend=m;draw()}else add(Math.min(pend,m),Math.max(pend,m)+30)}};
 el.onpointerdown=e=>{const c=e.target.closest('[data-m]');dn=c&&e.pointerType==='mouse'?+c.dataset.m:null};
 el.onpointerup=e=>{if(dn==null)return;const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-m]');const a=dn;dn=null;
  if(c&&+c.dataset.m!==a&&inA(a)){const b=+c.dataset.m;pend=null;add(Math.min(a,b),Math.max(a,b)+30)}};
 draw()}
/* best two-hour windows */
function best(ev,R){const c=[];(ev.slots||[]).forEach(w=>{for(let m=w.a;m+120<=w.b;m+=30){const ok=R.filter(r=>(r.slots||[]).some(s=>s.d==w.d&&s.a<=m&&s.b>=m+120));c.push({d:w.d,a:m,b:m+120,ok})}});
 c.sort((x,y)=>y.ok.length-x.ok.length||cmp(x,y));const out=[];
 for(const x of c){if(x.ok.length&&!out.some(o=>o.d==x.d&&x.a<o.b&&x.b>o.a))out.push(x);if(out.length==4)break}return out}
let mailer='default';try{mailer=localStorage.getItem('gt-mailer')||'default'}catch(e){}
const ios=/iPhone|iPad|iPod/i.test(navigator.userAgent),phone=/iPhone|iPad|Android|Mobi/i.test(navigator.userAgent);
const url=(c,body,sub='')=>{const b=encodeURIComponent(body),t=encodeURIComponent(sub);
 if(!c.includes('@'))return `sms:${c}?&body=${b}`;
 if(mailer=='gmail')return ios?`googlegmail:///co?to=${encodeURIComponent(c)}&subject=${t}&body=${b}`:`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c)}&su=${t}&body=${b}`;
 return `mailto:${c}?subject=${t}&body=${b}`};
const lk=(a,u)=>{a.href=u;a.target=u.startsWith('http')?'_blank':'_top'};
const mp=()=>`<label>Open emails with<select class="mp"><option value="default">My phone’s default mail app</option><option value="gmail"${mailer=='gmail'?' selected':''}>Gmail</option></select></label>`;
document.addEventListener('change',e=>{if(e.target.classList?.contains('mp')){mailer=e.target.value;try{localStorage.setItem('gt-mailer',mailer)}catch(x){}}});
const rk=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>(b%36).toString(36)).join('');
const sha=async t=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t))),b=>b.toString(16).padStart(2,'0')).join('');
const mine=()=>{try{const L=JSON.parse(localStorage.getItem('gt-hosted')||'[]');return L.length?`<section class="card"><h3 style="margin-top:0">Your Get Togethers</h3>${L.map(x=>`<div class="who"><span>${esc(x.t)}</span><a class="btn sm" href="#host-${x.id}-${x.hk}">See responses</a></div>`).join('')}</section>`:''}catch(e){return ''}};
const parse=v=>[...new Set(v.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean))].slice(0,50);
/* views */
let D={title:'',desc:'',host:'',email:'',slots:[]};
function route(){unsub.forEach(f=>f());unsub=[];memSubs=[];const[v,id,rid]=location.hash.slice(1).split('-');scrollTo(0,0);
 v=='join'&&id?attendee(id):v=='rsvp'&&id?rsvp(id,rid):v=='host'&&id?dash(id,rid):form()}
addEventListener('hashchange',route);
function form(){app.innerHTML=mine()+`<section class="card"><h2>Hosting a party? Let’s Get Together!</h2>
<label>Get Together! title <b>*</b><input id="t" placeholder="Janet’s Birthday Party!"></label>
<label>Event description <span class="opt">(optional)</span><textarea id="d" rows="4" placeholder="Let’s get together for Janet’s 40th birthday! Select a time and date that works best for you so we can maximize who can attend. No gifts needed!"></textarea></label>
<div class="row"><label>Your name <b>*</b><input id="n" placeholder="Peter" autocomplete="given-name"></label>
<label>Your email <b>*</b><input id="e" type="email" placeholder="peter@email.com" autocomplete="email"></label></div>
<h3>Select some dates that work for you</h3><div id="pk"></div>
<button class="btn" id="go">Continue to invites</button></section>`;
 [['t','title'],['d','desc'],['n','host'],['e','email']].forEach(([i,k])=>{const x=$('#'+i);x.value=D[k];x.oninput=()=>D[k]=x.value});
 picker($('#pk'),{slots:D.slots,max:10,min:2});
 $('#go').onclick=async()=>{if(!D.title.trim()||!D.host.trim()||!/\S+@\S+/.test(D.email))return toast('Please add a title, your name and a valid email.');
  if(D.slots.length<2)return toast('Pick at least 2 times (up to 10).');const id=rnd(),hk=rk();const mailTo=D.email,ttl=D.title;await put('events/'+id,{...D,final:null,hh:await sha(hk)});
  try{const hl=base()+'#host-'+id+'-'+hk,jl=base()+'#join-'+id;await put('mail/'+id+'_h_0',{to:mailTo,message:{subject:'Your Get Together host link: '+ttl,text:`Your Get Together! “${ttl}” is ready.\n\nYour private host link (keep it to yourself, it shows all responses):\n${hl}\n\nInvite link to share with friends:\n${jl}\n\nGet Together! by Bruna Productions LLC 2026.`,html:`<p>Your Get Together! “${esc(ttl)}” is ready.</p><p><b>Your private host link</b> (keep it to yourself, it shows all responses):<br><a href="${hl}">${hl}</a></p><p><b>Invite link to share with friends:</b><br><a href="${jl}">${jl}</a></p><p style="font-size:12px;color:#555">Get Together! by Bruna Productions LLC 2026.</p>`}})}catch(e){}try{const L=JSON.parse(localStorage.getItem('gt-hosted')||'[]');L.unshift({id,hk,t:D.title});localStorage.setItem('gt-hosted',JSON.stringify(L.slice(0,20)))}catch(e){}D={title:'',desc:'',host:'',email:'',slots:[]};location.hash='host-'+id+'-'+hk;toast('We emailed your private host link to '+esc(mailTo)+'. If you don’t see it, check spam.')}}
function dash(id,key){const khP=key?sha(key):Promise.resolve(null);let ev=null,R=[],tab='inv',sel=0,mode='one',txt=null,sent={};
 app.innerHTML='<section class="card big">Loading…</section>';
 watch(id,(e,r)=>{if(e!==undefined)ev=e;if(r)R=r;khP.then(kh=>{if(ev&&ev.hh&&ev.hh!==kh){app.innerHTML='<section class="card big">This page needs your private host link.</section>';return}if(ev&&!$('.tabs'))shell();if(ev&&tab=='resp')resp();if(ev===null)app.innerHTML='<section class="card big">We couldn’t find that Get Together.</section>'})});
 function shell(){app.innerHTML=`<div class="tabs"><button data-t="inv">Invite</button><button data-t="resp">Responses</button></div><div id="pane"></div>`;
  hostCard();$('.tabs').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;mark();tab=='inv'?inv():resp()}};mark();inv()}
 const hostCard=()=>{if(!key)return;const hl=base()+'#host-'+id+'-'+key,tx=`Here is your private link to see responses for ${ev.title}. Keep it to yourself:\n${hl}\n\nShare this invite link with friends:\n${base()}#join-${id}`;
  const c=document.createElement('section');c.className='card';c.innerHTML='<h3 style="margin-top:0">Your private host link</h3><p class="hint">Bookmark this page or email the link to yourself. It’s how you come back to see responses. Don’t share it with friends.</p>'+mp()+'<div style="margin-top:12px"><a class="btn sm" id="hl" target="_top" rel="noopener" href="mailto:">Email it to me</a> <button class="btn alt sm" id="cp" type="button">Copy link</button></div>';
  $('.tabs').before(c);$('#hl').onclick=e=>lk(e.currentTarget,url(ev.email,tx,'Your Get Together host link: '+ev.title));
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(hl);toast('Host link copied.')}catch(x){prompt('Copy your host link:',hl)}}};
 const mark=()=>document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 function inv(){const link=base()+'#join-'+id;
  const msg=`Hi! ${ev.host} is inviting you for ${ev.title}. Before we send out the final invite, we would love for you to enter in some dates and times that work for you! We will then select the date and time that works for the most people! Use this link to let them know what dates work for you: ${link}`;
  $('#pane').innerHTML=`<section class="card"><h2>Who should we invite?</h2>
  <label>Phone numbers (SMS)<textarea id="ph" rows="3" placeholder="555-123-4567, one per line or comma separated"></textarea></label>
  <label>Emails<textarea id="em" rows="3" placeholder="friend@email.com"></textarea></label>
  <div class="hint" id="cnt"></div>
  ${mp()}<label>Message <span class="opt">(edit if you like)</span><textarea id="m" rows="7"></textarea></label>
  <div class="duo"><button class="btn alt ${mode=='one'?'on':''}" data-md="one">One by one</button><button class="btn alt ${mode=='all'?'on':''}" data-md="all">All together</button></div>
  <div id="list"></div></section>`;
  const m=$('#m');m.value=txt??msg;m.oninput=()=>{txt=m.value;rows()};
  const rows=()=>{const ph=parse($('#ph').value),em=parse($('#em').value),all=[...ph,...em].slice(0,50);$('#cnt').textContent=all.length+' of 50 people';
   $('#list').innerHTML=(phone?'':'<div class="hint">These buttons work best on a phone. On a computer they open your default messaging or mail app, if one is set up.</div>')+(mode=='one'?all.map(c=>`<div class="who"><span>${esc(c)}</span><a class="btn sm" data-c="${esc(c)}" target="_top" rel="noopener" href="${esc(url(c,m.value,'Get Together: '+ev.title))}">${sent[c]?'Opened ✓':c.includes('@')?'Open email':'Open text'}</a></div>`).join(''):'')+
   `<a class="btn" data-all target="_top" rel="noopener" href="sms:">Message all ${all.length||''}</a>`;return{ph,em,all}};
